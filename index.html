<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NextOS - project</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { 
            --bg: url('https://cdn.discordapp.com/attachments/1490821953358135490/1493679242230104235/NextOS_wallpaper.png?ex=69dfd8b2&is=69de8732&hm=5e463232114b4fab3c4d65a07420822a271d5d3a5d1998f8472862886a915221&'); 
            --brightness: 1; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; -webkit-user-select: none; user-select: none; }
        body, html { width: 100vw; height: 100vh; overflow: hidden; background: #000; }
        #os { width: 100%; height: 100%; position: relative; background: #0d1f3c var(--bg) center/cover; transition: background 0.2s ease; filter: brightness(var(--brightness)); display: none; }

        /* Disable iframe events while dragging to prevent frame drops */
        body.dragging iframe {
            pointer-events: none !important;
        }

        /* LOCK SCREEN */
        #lock-screen { position: fixed; inset: 0; z-index: 20000; background: var(--bg) center/cover; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: transform 0.3s ease-out; }
        #lock-screen.unlocked { transform: translateY(-100%); }
        .lock-blur { position: absolute; inset: 0; background: rgba(0,0,0,0.55); z-index: -1; }
        #lock-time { font-size: 100px; color: white; font-weight: 200; }
        
        #pass-box { 
            margin-top: 20px; 
            background: rgba(255,255,255,0.2); 
            border: 1px solid rgba(255,255,255,0.3); 
            padding: 12px 30px; 
            border-radius: 25px; 
            color: white; 
            text-align: center; 
            outline: none; 
            min-width: 220px;
            cursor: text;
            -webkit-user-select: text;
            user-select: text;
            -webkit-text-security: disc;
            text-security: disc;
        }

        #pass-box:empty:before {
            content: attr(data-placeholder);
            color: rgba(255,255,255,0.6);
            -webkit-text-security: none;
            text-security: none;
        }

        /* MENUBAR */
        #menubar { position: absolute; top: 0; width: 100%; height: 28px; background: rgba(20, 20, 25, 0.92); display: flex; align-items: center; padding: 0 15px; z-index: 10000; border-bottom: 0.5px solid rgba(255, 255, 255, 0.1); color: white; font-size: 13px; }
        .apple-logo { cursor: pointer; display: flex; align-items: center; padding: 0 10px; margin-left: -10px; height: 100%; position: relative; }
        
        .dropdown { position: absolute; top: 28px; left: 0; width: 180px; background: rgba(35, 35, 40, 0.98); border-radius: 6px; border: 0.5px solid rgba(255,255,255,0.1); padding: 5px; display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 10001; }
        .dropdown.active { display: block; }
        .drop-item { padding: 5px 12px; border-radius: 4px; font-size: 13px; color: white; cursor: pointer; }
        .drop-item:hover { background: #007aff; }

        .m-menu-wrapper { position: relative; display: inline-block; }
        .gemini-btn { display: flex; align-items: center; cursor: pointer; padding: 2px 6px; border-radius: 4px; transition: background 0.2s; }
        .gemini-btn:hover { background: rgba(255,255,255,0.15); }
        
        .m-item { margin-left: 10px; opacity: 0.9; cursor: pointer; padding: 2px 6px; border-radius: 4px; }
        .m-item:hover { background: rgba(255,255,255,0.15); opacity: 1; }
        .m-bold { font-weight: 700; margin-left: 10px; }

        /* WINDOWS */
        .win { 
            position: absolute; 
            border-radius: 12px; 
            overflow: hidden; 
            background: rgba(26, 26, 30, 0.98); 
            border: 0.5px solid rgba(255, 255, 255, 0.2); 
            box-shadow: 0 20px 40px rgba(0,0,0,0.5); 
            display: flex; 
            flex-direction: column; 
            transition: opacity 0.15s ease-out; 
            contain: layout paint;
            will-change: transform;
            transform: translate3d(0, 0, 0);
        }
        .win.minimized { transform: scale(0) translateY(800px) !important; opacity: 0; pointer-events: none; }
        .win.fullscreen { width: 100vw !important; height: calc(100vh - 28px) !important; top: 28px !important; left: 0 !important; transform: translate3d(0,0,0) !important; border-radius: 0; }
        .win-bar { height: 38px; display: flex; align-items: center; padding: 0 12px; cursor: move; background: rgba(255, 255, 255, 0.05); }
        
        .traffic-lights { display: flex; gap: 8px; margin-right: 15px; }
        .tb { width: 12px; height: 12px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 9px; color: transparent; font-weight: bold; }
        .win-bar:hover .tb { color: rgba(0,0,0,0.6); }
        .tb-close { background: #ff5f57; } .tb-close::before { content: '×'; }
        .tb-min { background: #febc2e; } .tb-min::before { content: '−'; }
        .tb-max { background: #28c840; } .tb-max::before { content: '⤢'; }

        /* BROWSER INTERFACE */
        .browser-nav { display: flex; align-items: center; padding: 8px; background: #2c2c2e; gap: 12px; }
        .browser-url { flex: 1; background: #1c1c1e; border: none; border-radius: 6px; padding: 6px 12px; color: white; outline: none; font-size: 13px; }

        /* DOCK */
        #dock-container { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); padding: 8px; background: rgba(255, 255, 255, 0.12); border-radius: 20px; z-index: 9999; border: 0.5px solid rgba(255, 255, 255, 0.25); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); }
        #dock { display: flex; gap: 12px; }
        .dk { width: 52px; height: 52px; border-radius: 13px; cursor: pointer; transition: transform 0.1s ease, background 0.15s ease; display: flex; align-items: center; justify-content: center; color: white; background: rgba(255,255,255,0.18); box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .dk:hover { transform: scale(1.15) translateY(-4px); background: rgba(255,255,255,0.35); }

        .win-content { flex: 1; overflow-y: auto; background: #1c1c1e; color: white; contain: strict; }

        /* SETTINGS STYLES */
        .theme-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
        .theme-card { height: 60px; border-radius: 8px; background-size: cover; background-position: center; border: 2px solid transparent; cursor: pointer; display: flex; align-items: flex-end; padding: 5px; font-size: 11px; font-weight: bold; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
        .theme-card:hover { border-color: #007aff; }

        /* PHOTOS APP STYLES */
        .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; padding: 15px; }
        .photo-card { height: 110px; border-radius: 8px; background-size: cover; background-position: center; cursor: pointer; transition: transform 0.15s ease, box-shadow 0.15s ease; border: 1px solid rgba(255,255,255,0.1); }
        .photo-card:hover { transform: scale(1.04); box-shadow: 0 6px 15px rgba(0,0,0,0.5); }
        .photo-preview { position: absolute; inset: 0; background: rgba(0,0,0,0.9); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 10; padding: 15px; }
        .photo-preview.active { display: flex; }
        .photo-preview img { max-width: 100%; max-height: 80%; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .photo-close-btn { position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.2); border: none; color: white; padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 12px; }
        .photo-close-btn:hover { background: rgba(255,255,255,0.4); }

        /* MUSIC PLAYER STYLES */
        .track-item { padding: 10px; border-radius: 6px; background: rgba(255,255,255,0.05); margin-bottom: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .track-item:hover { background: rgba(255,255,255,0.15); }

        /* PAINT APP STYLES */
        .paint-toolbar { display: flex; gap: 10px; align-items: center; padding: 8px; background: #2c2c2e; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .paint-btn { padding: 4px 8px; background: #007aff; border: none; border-radius: 4px; color: white; cursor: pointer; font-size: 12px; }
    </style>
</head>

<script>
    const os = document.getElementById('os'), lock = document.getElementById('lock-screen');
    let zIndex = 1000, wins = {}, viewDate = new Date(), calcVal = "";
    const today = new Date();

    function playMacStartupChime() {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        if (ctx.state === 'suspended') ctx.resume();

        const freqs = [92.50, 138.59, 185.00, 233.08, 277.18, 369.99];
        freqs.forEach(freq => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle'; 
            osc.frequency.setValueAtTime(freq, ctx.currentTime);
            gain.gain.setValueAtTime(0, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.12, ctx.currentTime + 0.08); 
            gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 3.8); 
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + 3.8);
        });
    }

                </div>` 
        },
        help: { title: 'Help Guide', w: 400, h: 300, content: () => `<div style="padding:20px; color:#eee;"><h3>NextOS Guide</h3><p style="margin-top:10px; font-size:13px; line-height:1.5;">- Use the dock icons to open apps or external pages.<br>- Customize display wallpaper and brightness in Settings.</p></div>` }
    };

    function initPaint() {
        const canvas = document.getElementById('paint-canvas');
        if(!canvas) return;
        const ctx = canvas.getContext('2d');
        
        const rect = canvas.getBoundingClientRect();
        
        let tempCanvas = null;
        if (canvas.width > 0 && canvas.height > 0) {
            tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            tempCanvas.getContext('2d').drawImage(canvas, 0, 0);
        }

        canvas.width = rect.width;
        canvas.height = rect.height;

        if (tempCanvas) {
            ctx.drawImage(tempCanvas, 0, 0, tempCanvas.width, tempCanvas.height, 0, 0, canvas.width, canvas.height);
        }

        let painting = false;

        function startPosition(e) {
            painting = true;
            draw(e);
        }

        function finishedPosition() {
            painting = false;
            ctx.beginPath();
        }

        function draw(e) {
            if(!painting) return;
            const currentRect = canvas.getBoundingClientRect();
            
            const scaleX = canvas.width / currentRect.width;
            const scaleY = canvas.height / currentRect.height;

            const x = (e.clientX - currentRect.left) * scaleX;
            const y = (e.clientY - currentRect.top) * scaleY;

            const color = document.getElementById('paint-color').value;
            const size = document.getElementById('paint-size').value;

            ctx.lineWidth = size;
            ctx.lineCap = 'round';
            ctx.strokeStyle = color;

            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        canvas.onmousedown = startPosition;
        canvas.onmouseup = finishedPosition;
        canvas.onmousemove = draw;
        canvas.onmouseleave = finishedPosition;
    }

    function clearCanvas() {
        const canvas = document.getElementById('paint-canvas');
        if(canvas) {
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
    }

    function playSong(url, title) {
        const player = document.getElementById('audio-player');
        const titleEl = document.getElementById('now-playing-title');
        if(player && titleEl) {
            player.src = url;
            titleEl.innerText = title;
            player.play();
        }
    }

    function previewPhoto(url) {
        document.getElementById('preview-img').src = url;
        document.getElementById('photo-lightbox').classList.add('active');
    }

    function closePhotoPreview() {
        document.getElementById('photo-lightbox').classList.remove('active');
    }

    function setThemeByIndex(idx) { if (themes[idx]) setTheme(themes[idx].url); }
    function setTheme(url) { if (!url || !url.trim()) return; document.documentElement.style.setProperty('--bg', `url('${url.trim()}')`); }

    /* FUNCTIONAL NEXTILE AI ENGINE */
    async function sendGeminiMsg() {
        const input = document.getElementById('gemini-in');
        const chat = document.getElementById('gemini-chat');
        const query = input.value.trim();
        if(!query) return;

        chat.innerHTML += `<div style="margin-top:8px; text-align:right; color:#007aff;"><b>You:</b> ${escapeHtml(query)}</div>`;
        input.value = '';
        chat.scrollTop = chat.scrollHeight;

        const loadingId = 'loading-' + Date.now();
        chat.innerHTML += `<div id="${loadingId}" style="margin-top:8px; color:#aaa;"><b>Nextile AI:</b> <i>Thinking...</i></div>`;
        chat.scrollTop = chat.scrollHeight;

        const reply = await processNextileAI(query);
        const loader = document.getElementById(loadingId);
        if (loader) {
            loader.innerHTML = `<b>Nextile AI:</b> ${reply}`;
        }
        chat.scrollTop = chat.scrollHeight;
    }

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    async function processNextileAI(q) {
        const lower = q.toLowerCase();

        // 1. System OS Commands
        if (lower.includes('open paint')) { openApp('paint'); return "Opening Paint for you!"; }
        if (lower.includes('open safari') || lower.includes('open browser')) { openApp('browser'); return "Opening Safari!"; }
        if (lower.includes('open notes')) { openApp('notes'); return "Opening Notes!"; }
        if (lower.includes('open music')) { openApp('music'); return "Opening Music Player!"; }
        if (lower.includes('open photos')) { openApp('photos'); return "Opening Scenery Photos!"; }
        if (lower.includes('open calc') || lower.includes('open calculator')) { openApp('calc'); return "Opening Calculator!"; }
        if (lower.includes('open calendar')) { openApp('calendar'); return "Opening Calendar!"; }
        if (lower.includes('open terminal')) { openApp('terminal'); return "Opening Shell Terminal!"; }
        if (lower.includes('open weather')) { openApp('weather'); return "Opening Weather App!"; }
        if (lower.includes('open settings')) { openApp('settings'); return "Opening System Settings!"; }
        if (lower.includes('lock screen') || lower.includes('lock os')) { lockOS(); return "Locking screen..."; }
        if (lower.includes('clear canvas') || lower.includes('clear paint')) { clearCanvas(); return "Cleared the paint canvas for you!"; }

        // 2. Time & Date
        if (lower.includes('time')) { return `The current time is <b>${new Date().toLocaleTimeString([], {hour: 'numeric', minute:'2-digit', hour12: true})}</b>.`; }
        if (lower.includes('date') || lower.includes('day')) { return `Today is <b>${new Date().toLocaleDateString([], {weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'})}</b>.`; }

        // 3. Math Expression Solver
        if (/^[0-9+\-*/().\s^]+$/.test(q) && /[0-9]/.test(q)) {
            try {
                const res = eval(q.replace(/\^/g, '**'));
                return `The answer is <b>${res}</b>.`;
            } catch(e) {}
        }

        // 4. Live Knowledge API (Wikipedia)
        if (lower.startsWith('what is') || lower.startsWith('who is') || lower.startsWith('tell me about') || lower.startsWith('define')) {
            const searchTerm = q.replace(/^(what is|who is|tell me about|define)\s+/i, '').trim();
            try {
                const res = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(searchTerm)}`);
                if (res.ok) {
                    const data = await res.json();
                    if (data.extract) {
                        return `${data.extract}`;
                    }
                }
            } catch(e) {}
        }

        // 5. Friendly Conversations
        if (lower.includes('hello') || lower.includes('hi') || lower.includes('hey')) {
            return "Hello there! How can I help you in NextOS today? You can ask me questions, calculate math, or tell me to open apps!";
        }
        if (lower.includes('who are you') || lower.includes('your name')) {
            return "I am <b>Nextile AI</b>, your intelligent built-in assistant for NextOS!";
        }

        // Default fallback query lookup
        try {
            const res = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(q)}`);
            if (res.ok) {
                const data = await res.json();
                if (data.extract && data.type !== 'disambiguation') {
                    return `${data.extract}`;
                }
            }
        } catch(e) {}

        return `I'm not sure about that exact question, but you can ask me to open apps (e.g. <i>"open paint"</i>), check the time, solve math equations, or search topics (e.g. <i>"What is Mars?"</i>)!`;
    }

    function unlock() { 
        playMacStartupChime();
        lock.classList.add('unlocked'); 
        os.style.display = 'block'; 
        document.getElementById('pass-box').innerText = '';
    }
    
    function lockOS() { lock.classList.remove('unlocked'); closeAllMenus(); }
    function toggleMenu(id) { closeAllMenus(); document.getElementById(id).classList.toggle('active'); }
    function closeAllMenus() { document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('active')); }
    function minimizeAll() { Object.keys(wins).forEach(id => minA(id)); }
    function closeAllApps() { Object.keys(wins).forEach(id => cA(id)); }
    function toggleDarkMode() { alert('Theme updated!'); }
    function loadSearch(url) { document.getElementById('browser-frame').src = url; }

    function openApp(id) {
        closeAllMenus();
        const a = apps[id];
        if (!a) return;

        if (a.action) {
            a.action();
            return;
        }

        if (wins[id]) { wins[id].classList.remove('minimized'); wins[id].style.zIndex = ++zIndex; return; }
        const w = document.createElement('div');
        w.className = 'win'; w.id = 'win-'+id; w.style.width = a.w+'px'; w.style.height = a.h+'px';
        w.style.left = '100px'; w.style.top = '100px'; w.style.zIndex = ++zIndex;
        w.innerHTML = `<div class="win-bar" onmousedown="sD(event,'${id}')"><div class="traffic-lights"><button class="tb tb-close" onclick="cA('${id}')"></button><button class="tb tb-min" onclick="minA('${id}')"></button><button class="tb tb-max" onclick="tF('${id}')"></button></div><span style="margin:auto; font-size:12px; font-weight:600;">${a.title}</span></div><div class="win-content">${a.content()}</div>`;
        os.appendChild(w); wins[id] = w;
        
        if(id === 'calendar') rC();
        if(id === 'paint') setTimeout(initPaint, 50);
        if(id === 'notes') {
            const saved = localStorage.getItem('nextos_notes');
            if(saved) document.getElementById('notes-input').value = saved;
        }
        lucide.createIcons();
    }

    function rC() {
        const root = document.getElementById('cal-root');
        const monthDays = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 0).getDate();
        const startDay = new Date(viewDate.getFullYear(), viewDate.getMonth(), 1).getDay();
        const isCurrentMonth = viewDate.getMonth() === today.getMonth() && viewDate.getFullYear() === today.getFullYear();
        
        const weekdays = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
        let dayHeadersHtml = weekdays.map(day => `<div style="font-weight:bold; color:#8e8e93; font-size:12px; padding:6px 0;">${day}</div>`).join('');
        
        let gridHtml = '';
        for(let i=0; i<startDay; i++) gridHtml += `<div></div>`;
        for(let i=1; i<=monthDays; i++) {
            const blue = (isCurrentMonth && i === today.getDate()) ? 'background:#007aff; border-radius:50%; font-weight:bold;' : '';
            gridHtml += `<div style="padding:8px; ${blue}">${i}</div>`;
        }
        
        root.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center; padding:15px; background:#2c2c2e;">
                <button onclick="cD(-1)" style="background:none; border:none; color:white; cursor:pointer;"><i data-lucide="chevron-left"></i></button>
                <span style="font-weight:600;">${viewDate.toLocaleString('default',{month:'long'})} ${viewDate.getFullYear()}</span>
                <button onclick="cD(1)" style="background:none; border:none; color:white; cursor:pointer;"><i data-lucide="chevron-right"></i></button>
            </div>
            <div style="display:grid; grid-template-columns:repeat(7,1fr); padding:10px 10px 0 10px; text-align:center; border-bottom:0.5px solid #3a3a3c;">
                ${dayHeadersHtml}
            </div>
            <div style="display:grid; grid-template-columns:repeat(7,1fr); padding:10px; text-align:center; font-size:13px;">
                ${gridHtml}
            </div>`;
        lucide.createIcons();
    }

    window.cD = (d) => { viewDate.setMonth(viewDate.getMonth()+d); rC(); };
    window.hC = (b) => { const d = document.getElementById('d'); if(b==="C") calcVal=""; else if(b==="=") {try{calcVal=eval(calcVal).toString()}catch{calcVal="Error"}} else calcVal+=b; d.innerText = calcVal||"0"; };
    
    window.tF = (id) => {
        const w = wins[id];
        if (!w) return;
        const isFullscreen = w.classList.toggle('fullscreen');
        
        w.style.transform = 'translate3d(0,0,0)';
        
        if (!isFullscreen) {
            let l = parseInt(w.style.left) || 100;
            let t = parseInt(w.style.top) || 100;
            
            if (l < 10) l = 50;
            if (t < 35) t = 50;
            if (l > window.innerWidth - 100) l = window.innerWidth - 300;
            if (t > window.innerHeight - 100) t = window.innerHeight - 300;
            
            w.style.left = l + 'px';
            w.style.top = t + 'px';
        }

        if (id === 'paint') {
            setTimeout(initPaint, 50);
        }
    };

    window.minA = (id) => wins[id].classList.add('minimized');
    window.cA = (id) => { os.removeChild(wins[id]); delete wins[id]; };

    /* HIGH FPS DRAGGING LOGIC */
    let dW = null, oX, oY, mouseX = 0, mouseY = 0, ticking = false;

    function sD(e, id) { 
        if(wins[id].classList.contains('fullscreen')) return; 
        dW = wins[id]; 
        document.body.classList.add('dragging');
        dW.style.zIndex = ++zIndex; 
        oX = e.clientX - dW.offsetLeft; 
        oY = e.clientY - dW.offsetTop; 
        document.getElementById('active-app-name').innerText = apps[id].title; 
    }

    document.onmousemove = (e) => { 
        if(dW) { 
            mouseX = e.clientX;
            mouseY = e.clientY;
            if (!ticking) {
                requestAnimationFrame(updateWindowPosition);
                ticking = true;
            }
        } 
    };

    function updateWindowPosition() {
        if (dW) {
            dW.style.transform = `translate3d(${mouseX - oX - dW.offsetLeft}px, ${mouseY - oY - dW.offsetTop}px, 0)`;
        }
        ticking = false;
    }

    document.onmouseup = () => {
        if (dW) {
            dW.style.left = (mouseX - oX) + 'px';
            dW.style.top = (mouseY - oY) + 'px';
            dW.style.transform = 'translate3d(0,0,0)';
        }
        dW = null;
        document.body.classList.remove('dragging');
    };

    setInterval(() => { 
        const now = new Date();
        const timeOptions = { hour: 'numeric', minute: '2-digit', hour12: true };
        const dateOptions = { weekday: 'short', month: 'short', day: 'numeric' };
        const tStr = now.toLocaleTimeString([], timeOptions);
        const dStr = now.toLocaleDateString([], dateOptions);
        
        document.getElementById('clock').innerText = tStr;
        document.getElementById('lock-time').innerText = tStr;
        document.getElementById('menubar-date').innerText = dStr;
    }, 1000);
    
    window.onload = () => lucide.createIcons();
</script>
