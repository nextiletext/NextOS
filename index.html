<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextOS</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop');
            --brightness: 1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #000;
        }

        /* Filter wrapper for display brightness control */
        #os-root {
            width: 100%;
            height: 100%;
            filter: brightness(var(--brightness));
        }

        /* LOCK SCREEN */
        #lock-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: var(--bg);
            background-size: cover;
            background-position: center;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #lock-screen.unlocked {
            transform: translateY(-100%);
        }

        .lock-clock {
            font-size: 80px;
            font-weight: 200;
            margin-bottom: 20px;
            text-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .pin-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .pin-dots {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            height: 15px;
        }

        .pin-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1.5px solid white;
            transition: background 0.2s;
        }

        .pin-dot.filled {
            background: white;
        }

        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .num-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: background 0.2s;
        }

        .num-btn:active {
            background: rgba(255, 255, 255, 0.4);
        }

        /* OS ENVIRONMENT */
        #os {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: var(--bg);
            background-size: cover;
            background-position: center;
            display: none;
        }

        /* TOP MENUBAR */
        #menubar {
            height: 28px;
            background: rgba(20, 20, 25, 0.4);
            backdrop-filter: blur(25px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            color: white;
            font-size: 13px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 9000;
            position: relative;
        }

        .menu-left, .menu-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .menu-item {
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            position: relative;
        }

        .menu-item:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* DROPDOWNS */
        .dropdown {
            position: absolute;
            top: 28px;
            left: 0;
            background: rgba(30, 30, 35, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            padding: 5px;
            display: none;
            flex-direction: column;
            min-width: 160px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 9001;
        }

        .dropdown.active {
            display: flex;
        }

        .dropdown-item {
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            color: #eee;
        }

        .dropdown-item:hover {
            background: #007aff;
            color: white;
        }

        .dropdown-divider {
            height: 1px;
            background: rgba(255,255,255,0.1);
            margin: 4px 0;
        }

        /* DESKTOP & FOLDERS */
        #desktop {
            position: absolute;
            top: 28px;
            left: 0;
            right: 0;
            bottom: 70px;
            padding: 20px;
        }

        .folder-icon {
            width: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: absolute;
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid transparent;
        }

        .folder-icon:hover {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .folder-icon i {
            color: #48b2ff;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
        }

        .folder-name {
            color: white;
            font-size: 11px;
            margin-top: 4px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            text-align: center;
            word-break: break-all;
            outline: none;
        }

        /* CONTEXT MENU */
        #context-menu {
            position: absolute;
            background: rgba(30, 30, 35, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            padding: 5px;
            display: none;
            flex-direction: column;
            min-width: 150px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 9500;
        }

        /* DOCK */
        #dock-container {
            position: absolute;
            bottom: 10px;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 9000;
        }

        #dock {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 12px;
            border-radius: 20px;
            display: flex;
            gap: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .dock-app {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: white;
            position: relative;
        }

        .dock-app:hover {
            transform: scale(1.2) translateY(-8px);
        }

        /* WINDOWS */
        .win {
            position: absolute;
            background: rgba(25, 25, 30, 0.85);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 250px;
            min-height: 150px;
        }

        .win.minimized {
            display: none !important;
        }

        .win.fullscreen {
            top: 28px !important;
            left: 0 !important;
            width: 100% !important;
            height: calc(100% - 28px) !important;
            border-radius: 0;
        }

        .win-bar {
            height: 38px;
            background: rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            padding: 0 12px;
            cursor: move;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .traffic-lights {
            display: flex;
            gap: 8px;
        }

        .tb {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
        }

        .tb-close { background: #ff5f56; }
        .tb-min { background: #ffbd2e; }
        .tb-max { background: #27c93f; }

        .win-content {
            flex: 1;
            overflow: auto;
            color: white;
            position: relative;
        }

        /* APP STYLES */
        .theme-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        .theme-card {
            height: 70px;
            border-radius: 8px;
            background-size: cover;
            background-position: center;
            cursor: pointer;
            border: 2px solid transparent;
            display: flex;
            align-items: flex-end;
            padding: 6px;
        }

        .theme-card:hover {
            border-color: #007aff;
        }

        .theme-card span {
            font-size: 11px;
            background: rgba(0,0,0,0.6);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .browser-nav {
            display: flex;
            gap: 8px;
            padding: 8px;
            background: #1c1c1e;
            align-items: center;
        }

        .browser-url {
            flex: 1;
            background: #2c2c2e;
            border: none;
            border-radius: 6px;
            padding: 6px 12px;
            color: white;
            outline: none;
            font-size: 12px;
        }

        .track-item {
            padding: 8px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-size: 13px;
        }

        .track-item:hover {
            background: rgba(255,255,255,0.1);
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 10px;
        }

        .photo-card {
            aspect-ratio: 1;
            background-size: cover;
            background-position: center;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .photo-card:hover {
            transform: scale(1.03);
        }

        .photo-preview {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 10;
        }

        .photo-preview.active {
            display: flex;
        }

        .photo-preview img {
            max-width: 100%;
            max-height: 80%;
            border-radius: 8px;
            object-fit: contain;
        }

        .photo-close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        .paint-toolbar {
            display: flex;
            gap: 10px;
            padding: 8px;
            background: #2a2a30;
            align-items: center;
        }

        .paint-btn {
            background: #3a3a42;
            border: none;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        /* FINDER APP STYLES */
        .finder-nav-item {
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            color: #ccc;
            transition: background 0.15s, color 0.15s;
        }

        .finder-nav-item:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .finder-nav-item.active {
            background: #007aff;
            color: white;
            font-weight: 500;
        }

        .finder-file-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

    let pin = "";

    let finderCurrentPath = 'desktop';

    function playMacStartupChime() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const now = ctx.currentTime;

            const osc1 = ctx.createOscillator();
            const osc2 = ctx.createOscillator();
            const osc3 = ctx.createOscillator();
            const gain = ctx.createGain();

            osc1.type = 'sine';
            osc2.type = 'sine';
            osc3.type = 'sine';

            osc1.frequency.setValueAtTime(146.83, now); // D3
            osc2.frequency.setValueAtTime(220.00, now); // A3
            osc3.frequency.setValueAtTime(293.66, now); // D4

            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(0.3, now + 0.1);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 3.5);

            osc1.connect(gain);
            osc2.connect(gain);
            osc3.connect(gain);
            gain.connect(ctx.destination);

            osc1.start(now);
            osc2.start(now);
            osc3.start(now);

            osc1.stop(now + 3.6);
            osc2.stop(now + 3.6);
            osc3.stop(now + 3.6);
        } catch (e) {
            console.log("AudioContext blocked or not supported until direct interaction.");
        }
    }

    const themes = [
        { name: 'Flow', url: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop' },
        { name: 'Ventura', url: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=2564&auto=format&fit=crop' },
        { name: 'Monterey', url: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop' },
        { name: 'Dark Mode', url: 'https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=2564&auto=format&fit=crop' }
    ];

    const songs = [
        { name: 'Lofi Chill', url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3' },
        { name: 'Acoustic Dreams', url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3' },
        { name: 'Ambient Vibe', url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3' }

    // PASSCODE LOGIC
    function pressNum(n) {
        if (pin.length < 4) {
            pin += n;
            updateDots();
        }
        if (pin.length === 4) {
            setTimeout(() => {
                if (pin === correctPin) {
                    unlock();
                } else {
                    document.getElementById('pass-box').innerText = "Incorrect Passcode";
                    clearPin();
                }
            }, 100);
        }
    }

    function updateDots() {
        for (let i = 0; i < 4; i++) {
            const dot = document.getElementById(`dot-${i}`);
            if (i < pin.length) dot.classList.add('filled');
            else dot.classList.remove('filled');
        }
    }

    function clearPin() {
        pin = "";
        updateDots();
    }

    function backspacePin() {
        pin = pin.slice(0, -1);
        updateDots();
    }

    // DRAGGABLE WINDOWS AND FOLDERS LOGIC
    document.addEventListener('mousemove', (e) => {
        if (draggedElement) {
            draggedElement.style.left = (e.clientX - dragOffsetX) + 'px';
            draggedElement.style.top = (e.clientY - dragOffsetY) + 'px';
        }
    });

    document.addEventListener('mouseup', () => {
        draggedElement = null;
    });

    function sD(e, winId) {
        draggedElement = document.getElementById('win-' + winId);
        dragOffsetX = e.clientX - draggedElement.offsetLeft;
        dragOffsetY = e.clientY - draggedElement.offsetTop;
        draggedElement.style.zIndex = ++zIndex;
    }

    function makeFolderDraggable(el) {
        el.onmousedown = function(e) {
            if (e.button !== 0) return;
            if (e.target.classList.contains('folder-name')) return;
            draggedElement = el;
            dragOffsetX = e.clientX - el.offsetLeft;
            dragOffsetY = e.clientY - el.offsetTop;
        };
    }

    // CONTEXT MENU & FOLDER MANAGEMENT
    function showContextMenu(e) {
        e.preventDefault();
        const cm = document.getElementById('context-menu');
        cm.style.display = 'flex';
        cm.style.left = e.clientX + 'px';
        cm.style.top = e.clientY + 'px';

        const folderEl = e.target.closest('.folder-icon');
        if (folderEl) {
            selectedFolderId = folderEl.id;
            const isZip = folderEl.getAttribute('data-is-zip') === 'true';
            document.getElementById('ctx-rename').style.display = 'flex';
            document.getElementById('ctx-compress').style.display = isZip ? 'none' : 'flex';
            document.getElementById('ctx-extract').style.display = isZip ? 'flex' : 'none';
            document.getElementById('ctx-delete').style.display = 'flex';
            document.getElementById('ctx-new-folder').style.display = 'none';
        } else {
            selectedFolderId = null;
            document.getElementById('ctx-rename').style.display = 'none';
            document.getElementById('ctx-compress').style.display = 'none';
            document.getElementById('ctx-extract').style.display = 'none';
            document.getElementById('ctx-delete').style.display = 'none';
            document.getElementById('ctx-new-folder').style.display = 'flex';
        }
    }

    function closeContextMenu() {
        document.getElementById('context-menu').style.display = 'none';
    }

    document.addEventListener('click', (e) => {
        if (!e.target.closest('#context-menu')) closeContextMenu();
    });

    function createNewFolder(customName = null, isZip = false) {
        folderCount++;
        const desktop = document.getElementById('desktop');
        const folder = document.createElement('div');
        const id = 'folder-' + Date.now();
        folder.className = 'folder-icon';
        folder.id = id;
        folder.setAttribute('data-is-zip', isZip);

        const offset = (folderCount * 20) % 200;
        folder.style.left = (30 + offset) + 'px';
        folder.style.top = (30 + offset) + 'px';

        const name = customName || `Untitled Folder ${folderCount}`;
        const iconName = isZip ? 'file-archive' : 'folder';

        folder.innerHTML = `
            <i data-lucide="${iconName}" style="width:48px; height:48px;"></i>
            <span class="folder-name" id="name-${id}">${name}</span>
        `;

        folder.oncontextmenu = (e) => {
            e.stopPropagation();
            showContextMenu(e);
        };

        folder.ondblclick = () => {
            if (isZip) {
                alert(`Cannot open compressed archive "${name}". Extract it first!`);
            } else {
                openFolderWindow(name);
            }
        };

        desktop.appendChild(folder);
        makeFolderDraggable(folder);

        // Sync with Finder Virtual File System
        if (!fileSystem.desktop.find(f => f.name === name)) {
            fileSystem.desktop.push({
                id: 'fs_' + Date.now(),
                name: name,
                type: 'folder'
            });
            if (wins['finder']) renderFinderUI();
        }

        lucide.createIcons();
    }

    function renameFolderFromContext() {
        if (!selectedFolderId) return;
        const nameSpan = document.getElementById(`name-${selectedFolderId}`);
        closeContextMenu();

        nameSpan.contentEditable = "true";
        nameSpan.focus();

        const range = document.createRange();
        range.selectNodeContents(nameSpan);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);

        nameSpan.onkeydown = function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                nameSpan.contentEditable = "false";
            }
        };
    }

    function compressFolderFromContext() {
        if (!selectedFolderId) return;
        const nameSpan = document.getElementById(`name-${selectedFolderId}`);
        createNewFolder(`${nameSpan.innerText}.zip`, true);
        closeContextMenu();
    }

    function extractFolderFromContext() {
        if (!selectedFolderId) return;
        const nameSpan = document.getElementById(`name-${selectedFolderId}`);
        let cleanName = nameSpan.innerText.replace('.zip', '') + '_extracted';
        createNewFolder(cleanName, false);
        closeContextMenu();
    }

    function deleteFolderFromContext() {
        if (!selectedFolderId) return;
        const folderEl = document.getElementById(selectedFolderId);
        if (folderEl) folderEl.remove();
        closeContextMenu();
    }

    function openFolderWindow(title) {
        openApp('finder');
        const folderKey = title.toLowerCase().replace(/\s+/g, '_');
        if (!fileSystem[folderKey]) {
            fileSystem[folderKey] = [];
        }
        setTimeout(() => {
            navigateFinder(folderKey);
        }, 50);
    }

    // FINDER CONTROLLER LOGIC
    function navigateFinder(path) {
        finderCurrentPath = path;
        if (finderHistory[finderHistoryIndex] !== path) {
            finderHistory = finderHistory.slice(0, finderHistoryIndex + 1);
            finderHistory.push(path);
            finderHistoryIndex = finderHistory.length - 1;
        }
        renderFinderUI();
    }

    function finderGoBack() {
        if (finderHistoryIndex > 0) {
            finderHistoryIndex--;
            finderCurrentPath = finderHistory[finderHistoryIndex];
            renderFinderUI();
        }
    }

    function finderGoForward() {
        if (finderHistoryIndex < finderHistory.length - 1) {
            finderHistoryIndex++;
            finderCurrentPath = finderHistory[finderHistoryIndex];
            renderFinderUI();
        }
    }

    function renderFinderUI() {
        const grid = document.getElementById('finder-grid');
        const titleEl = document.getElementById('finder-current-title');
        const statusEl = document.getElementById('finder-status');
        if (!grid) return;

        document.querySelectorAll('.finder-nav-item').forEach(item => item.classList.remove('active'));
        const activeNav = document.getElementById(`fnav-${finderCurrentPath}`);
        if (activeNav) activeNav.classList.add('active');

        if (titleEl) titleEl.innerText = finderCurrentPath.replace(/_/g, ' ');

        let items = fileSystem[finderCurrentPath] || [];
        const searchVal = document.getElementById('finder-search')?.value.toLowerCase().trim();
        if (searchVal) {
            items = items.filter(item => item.name.toLowerCase().includes(searchVal));
        }

        if (statusEl) statusEl.innerText = `${items.length} item${items.length === 1 ? '' : 's'}`;

        if (items.length === 0) {
            grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; color:#666; margin-top:40px; font-size:13px;">Folder is Empty</div>`;
            lucide.createIcons();
            return;
        }

        grid.innerHTML = items.map(item => {
            let iconMarkup = '';
            if (item.type === 'folder') {
                iconMarkup = `<i data-lucide="folder" style="width:36px; height:36px; color:#48b2ff;"></i>`;
            } else if (item.type === 'app') {
                iconMarkup = `<div style="width:36px; height:36px; border-radius:8px; background:${item.color || '#007aff'}; display:flex; align-items:center; justify-content:center; color:white;"><i data-lucide="${item.icon}" style="width:20px; height:20px;"></i></div>`;
            } else if (item.type === 'photo') {
                iconMarkup = `<i data-lucide="image" style="width:36px; height:36px; color:#ff9500;"></i>`;
            } else {
                iconMarkup = `<i data-lucide="file-text" style="width:36px; height:36px; color:#aaa;"></i>`;
            }

            return `
                <div class="finder-file-item" 
                     ondblclick="openFinderItem('${item.id}')"
                     style="display:flex; flex-direction:column; align-items:center; justify-content:center; padding:8px; border-radius:8px; cursor:pointer; text-align:center; user-select:none; gap:6px;">
                    ${iconMarkup}
                    <span style="font-size:11px; color:#eee; word-break:break-word; line-height:1.2; max-width:75px; text-overflow:ellipsis; overflow:hidden; white-space:nowrap;">${escapeHtml(item.name)}</span>
                </div>
            `;
        }).join('');

        lucide.createIcons();
    }

    function openFinderItem(id) {
        let items = fileSystem[finderCurrentPath] || [];
        let item = items.find(i => i.id === id);
        if (!item) return;

        if (item.type === 'app') {
            openApp(item.appId);
        } else if (item.type === 'folder') {
            const pathKey = item.name.toLowerCase().replace(/\s+/g, '_');
            if (!fileSystem[pathKey]) {
                fileSystem[pathKey] = [];
            }
            navigateFinder(pathKey);
        } else if (item.type === 'photo') {
            openApp('photos');
            if (item.url) previewPhoto(item.url);
        } else if (item.type === 'file') {
            openApp('notes');
            setTimeout(() => {
                const notesIn = document.getElementById('notes-input');
                if (notesIn) notesIn.value = item.content || `[File Content: ${item.name}]`;
            }, 100);
        }
    }

    function createFinderFolder() {
        if (!fileSystem[finderCurrentPath]) fileSystem[finderCurrentPath] = [];
        const count = fileSystem[finderCurrentPath].length + 1;
        const newFolderName = `New Folder ${count}`;
        const newFolderObj = {
            id: 'fs_' + Date.now(),
            name: newFolderName,
            type: 'folder'
        };
        fileSystem[finderCurrentPath].push(newFolderObj);

        if (finderCurrentPath === 'desktop') {
            createNewFolder(newFolderName);
        }

        renderFinderUI();
    }
