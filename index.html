<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NextOS - Wallpaper Themes Build</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { 
            --bg: url('https://cdn.discordapp.com/attachments/1490821953358135490/1493679242230104235/NextOS_wallpaper.png?ex=69dfd8b2&is=69de8732&hm=5e463232114b4fab3c4d65a07420822a271d5d3a5d1998f8472862886a915221&'); 
            --brightness: 1; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; -webkit-user-select: none; user-select: none; }
        body, html { width: 100vw; height: 100vh; overflow: hidden; background: #000; }
        #os { width: 100%; height: 100%; position: relative; background: #0d1f3c var(--bg) center/cover transition: background 0.3s ease; filter: brightness(var(--brightness)); display: none; }

        /* LOCK SCREEN */
        #lock-screen { position: fixed; inset: 0; z-index: 20000; background: var(--bg) center/cover; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        #lock-screen.unlocked { transform: translateY(-100%); }
        .lock-blur { position: absolute; inset: 0; backdrop-filter: blur(35px); background: rgba(0,0,0,0.3); z-index: -1; }
        #lock-time { font-size: 100px; color: white; font-weight: 200; }
        #pass-box { margin-top: 20px; background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); padding: 12px 30px; border-radius: 25px; color: white; text-align: center; outline: none; backdrop-filter: blur(15px); }

        /* MENUBAR */
        #menubar { position: absolute; top: 0; width: 100%; height: 28px; background: rgba(20, 20, 25, 0.75); backdrop-filter: blur(30px); display: flex; align-items: center; padding: 0 15px; z-index: 10000; border-bottom: 0.5px solid rgba(255, 255, 255, 0.1); color: white; font-size: 13px; }
        .apple-logo { cursor: pointer; display: flex; align-items: center; padding: 0 10px; margin-left: -10px; height: 100%; position: relative; }
        
        .dropdown { position: absolute; top: 28px; left: 0; width: 180px; background: rgba(35, 35, 40, 0.95); backdrop-filter: blur(40px); border-radius: 6px; border: 0.5px solid rgba(255,255,255,0.1); padding: 5px; display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 10001; }
        .dropdown.active { display: block; }
        .drop-item { padding: 5px 12px; border-radius: 4px; font-size: 13px; color: white; cursor: pointer; }
        .drop-item:hover { background: #007aff; }

        .m-menu-wrapper { position: relative; display: inline-block; }
        .gemini-btn { display: flex; align-items: center; cursor: pointer; padding: 2px 6px; border-radius: 4px; transition: background 0.2s; }
        .gemini-btn:hover { background: rgba(255,255,255,0.15); }
        .gemini-sparkle { width: 16px; height: 16px; vertical-align: middle; }
        
        .m-item { margin-left: 10px; opacity: 0.9; cursor: pointer; padding: 2px 6px; border-radius: 4px; }
        .m-item:hover { background: rgba(255,255,255,0.15); opacity: 1; }
        .m-bold { font-weight: 700; margin-left: 10px; }

        /* WINDOWS */
        .win { position: absolute; border-radius: 12px; overflow: hidden; background: rgba(30, 30, 35, 0.98); backdrop-filter: blur(50px); border: 0.5px solid rgba(255, 255, 255, 0.2); box-shadow: 0 40px 80px rgba(0,0,0,0.6); display: flex; flex-direction: column; transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s; }
        .win.minimized { transform: scale(0) translateY(800px); opacity: 0; pointer-events: none; }
        .win.fullscreen { width: 100vw !important; height: calc(100vh - 28px) !important; top: 28px !important; left: 0 !important; border-radius: 0; }
        .win-bar { height: 38px; display: flex; align-items: center; padding: 0 12px; cursor: move; background: rgba(255, 255, 255, 0.05); }
        
        .traffic-lights { display: flex; gap: 8px; margin-right: 15px; }
        .tb { width: 12px; height: 12px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 9px; color: transparent; transition: color 0.1s; font-weight: bold; }
        .win-bar:hover .tb { color: rgba(0,0,0,0.6); }
        .tb-close { background: #ff5f57; } .tb-close::before { content: '×'; }
        .tb-min { background: #febc2e; } .tb-min::before { content: '−'; }
        .tb-max { background: #28c840; } .tb-max::before { content: '⤢'; }

        /* BROWSER INTERFACE */
        .browser-nav { display: flex; align-items: center; padding: 8px; background: #2c2c2e; gap: 12px; }
        .browser-url { flex: 1; background: #1c1c1e; border: none; border-radius: 6px; padding: 6px 12px; color: white; outline: none; font-size: 13px; }

        /* DOCK */
        #dock-container { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); padding: 8px; background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(30px); border-radius: 20px; z-index: 9999; border: 0.5px solid rgba(255,255,255,0.2); }
        #dock { display: flex; gap: 12px; }
        .dk { width: 52px; height: 52px; border-radius: 13px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; color: white; background: rgba(255,255,255,0.15); box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .dk:hover { transform: scale(1.2) translateY(-5px); background: rgba(255,255,255,0.3); }

        .win-content { flex: 1; overflow-y: auto; background: #1c1c1e; color: white; }

        /* SETTINGS STYLES */
        .theme-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
        .theme-card { height: 60px; border-radius: 8px; background-size: cover; background-position: center; border: 2px solid transparent; cursor: pointer; display: flex; align-items: flex-end; padding: 5px; font-size: 11px; font-weight: bold; text-shadow: 0 1px 3px rgba(0,0,0,0.8); transition: border-color 0.2s, transform 0.2s; }
        .theme-card:hover { transform: scale(1.02); border-color: #007aff; }
    </style>
</head>
<body onclick="closeAllMenus()">

<div id="lock-screen"><div class="lock-blur"></div><div id="lock-time">00:00 AM</div><input type="password" id="pass-box" placeholder="Enter Password" onkeydown="if(event.key==='Enter') unlock()"></div>

<div id="os">
    <div id="menubar">
        <div class="m-menu-wrapper">
            <div class="apple-logo" onclick="event.stopPropagation(); toggleMenu('apple-dropdown')"><i data-lucide="apple" style="width:16px;"></i></div>
            <div class="dropdown" id="apple-dropdown">
                <div class="drop-item" onclick="lockOS()">Lock Screen</div>
                <div class="drop-item" onclick="openApp('settings')">System Settings...</div>
            </div>
        </div>

        <div class="gemini-btn" title="Open Gemini AI" onclick="openApp('gemini')">
            <img src="https://www.gstatic.com/lamda/images/gemini_sparkle_v002_d4735304ef629dc620163.svg" class="gemini-sparkle">
        </div>

        <span class="m-bold" id="active-app-name">Finder</span>

        <div class="m-menu-wrapper">
            <span class="m-item" onclick="event.stopPropagation(); toggleMenu('file-dropdown')">File</span>
            <div class="dropdown" id="file-dropdown">
                <div class="drop-item" onclick="openApp('terminal')">New Terminal Window</div>
                <div class="drop-item" onclick="openApp('browser')">New Browser Window</div>
            </div>
        </div>

        <div class="m-menu-wrapper">
            <span class="m-item" onclick="event.stopPropagation(); toggleMenu('edit-dropdown')">Edit</span>
            <div class="dropdown" id="edit-dropdown">
                <div class="drop-item" onclick="alert('Undo action')">Undo</div>
                <div class="drop-item" onclick="alert('Redo action')">Redo</div>
            </div>
        </div>

        <div class="m-menu-wrapper">
            <span class="m-item" onclick="event.stopPropagation(); toggleMenu('view-dropdown')">View</span>
            <div class="dropdown" id="view-dropdown">
                <div class="drop-item" onclick="toggleDarkMode()">Toggle Theme Accent</div>
            </div>
        </div>

        <div class="m-menu-wrapper">
            <span class="m-item" onclick="event.stopPropagation(); toggleMenu('go-dropdown')">Go</span>
            <div class="dropdown" id="go-dropdown">
                <div class="drop-item" onclick="openApp('browser')">Go to Web Browser</div>
                <div class="drop-item" onclick="openApp('terminal')">Go to Shell Terminal</div>
            </div>
        </div>

        <div class="m-menu-wrapper">
            <span class="m-item" onclick="event.stopPropagation(); toggleMenu('window-dropdown')">Window</span>
            <div class="dropdown" id="window-dropdown">
                <div class="drop-item" onclick="minimizeAll()">Minimize All</div>
                <div class="drop-item" onclick="closeAllApps()">Close All Windows</div>
            </div>
        </div>

        <div class="m-menu-wrapper">
            <span class="m-item" onclick="event.stopPropagation(); toggleMenu('help-dropdown')">Help</span>
            <div class="dropdown" id="help-dropdown">
                <div class="drop-item" onclick="openApp('help')">NextOS Help Guide</div>
            </div>
        </div>

        <span id="clock-container" style="margin-left:auto; font-weight:500;">
            <span id="menubar-date" style="margin-right:10px;"></span>
            <span id="clock">00:00 AM</span>
        </span>
    </div>

    <div id="dock-container"><div id="dock">
        <div class="dk" title="Safari" onclick="openApp('browser')"><i data-lucide="globe"></i></div>
        <div class="dk" title="Calculator" onclick="openApp('calc')"><i data-lucide="calculator"></i></div>
        <div class="dk" title="Calendar" onclick="openApp('calendar')"><i data-lucide="calendar"></i></div>
        <div class="dk" title="Terminal" onclick="openApp('terminal')"><i data-lucide="terminal"></i></div>
        <div class="dk" title="Weather" onclick="openApp('weather')"><i data-lucide="cloud-sun"></i></div>
        <div class="dk" title="Settings" onclick="openApp('settings')"><i data-lucide="settings"></i></div>
    </div></div>
</div>

<script>
    const os = document.getElementById('os'), lock = document.getElementById('lock-screen');
    let zIndex = 1000, wins = {}, viewDate = new Date(), calcVal = "";
    const today = new Date();

    const themes = [
        { name: 'Classic NextOS', url: 'https://cdn.discordapp.com/attachments/1490821953358135490/1493679242230104235/NextOS_wallpaper.png?ex=69dfd8b2&is=69de8732&hm=5e463232114b4fab3c4d65a07420822a271d5d3a5d1998f8472862886a915221&' },
        { name: 'Dark Abstract', url: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1200&q=80' },
        { name: 'Neon Wave', url: 'https://images.unsplash.com/photo-1550684848-fac1c5b4e853?auto=format&fit=crop&w=1200&q=80' },
        { name: 'Minimal Mountains', url: 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1200&q=80' },
        { name: 'Aurora', url: 'https://images.unsplash.com/photo-1531366936337-7c912a4589a7?auto=format&fit=crop&w=1200&q=80' }
    ];

    const apps = {
        browser: { 
            title: 'Safari', w: 900, h: 600, 
            content: () => `
                <div class="browser-nav">
                    <i data-lucide="home" style="cursor:pointer; width:18px;" onclick="loadSearch('https://www.google.com/search?igu=1')"></i>
                    <input class="browser-url" id="url-bar" value="Search Google..." onfocus="this.value=''" onkeydown="if(event.key==='Enter') loadSearch('https://www.google.com/search?igu=1&q=' + encodeURIComponent(this.value))">
                    <i data-lucide="rotate-cw" style="cursor:pointer; width:18px;" onclick="loadSearch(document.getElementById('browser-frame').src)"></i>
                </div>
                <iframe id="browser-frame" src="https://www.google.com/search?igu=1" style="width:100%; height:calc(100% - 45px); border:none; background:white;"></iframe>` 
        },
        gemini: {
            title: 'Gemini Assistant', w: 400, h: 500,
            content: () => `
                <div style="display:flex; flex-direction:column; height:100%; padding:15px; background:#1e1e24;">
                    <div style="display:flex; align-items:center; gap:8px; margin-bottom:10px;">
                        <img src="https://www.gstatic.com/lamda/images/gemini_sparkle_v002_d4735304ef629dc620163.svg" style="width:20px;">
                        <h4 style="color:#fff;">Gemini AI</h4>
                    </div>
                    <div id="gemini-chat" style="flex:1; overflow-y:auto; background:#121215; border-radius:8px; padding:10px; font-size:13px; color:#ddd; margin-bottom:10px;">
                        Hello! How can I assist you in NextOS today?
                    </div>
                    <div style="display:flex; gap:5px;">
                        <input id="gemini-in" placeholder="Ask Gemini..." style="flex:1; padding:8px; border-radius:6px; border:none; background:#2a2a30; color:white; outline:none;" onkeydown="if(event.key==='Enter') sendGeminiMsg()">
                        <button onclick="sendGeminiMsg()" style="padding:8px 12px; background:#007aff; border:none; border-radius:6px; color:white; cursor:pointer;">Send</button>
                    </div>
                </div>`
        },
        calc: { title: 'Calculator', w: 280, h: 420, content: () => `<div id="d" style="padding:20px; font-size:40px; text-align:right; height:70px; background:#111;">0</div><div style="display:grid; grid-template-columns:repeat(4,1fr); height:calc(100% - 70px);">${["C","±","%","/","7","8","9","*","4","5","6","-","1","2","3","+","0",".","="].map(b=>`<div onclick="hC('${b}')" style="border:0.2px solid #2c2c2e; display:flex; align-items:center; justify-content:center; cursor:pointer; background:#333;">${b}</div>`).join('')}</div>` },
        calendar: { title: 'Calendar', w: 350, h: 420, content: () => `<div id="cal-root"></div>` },
        terminal: { title: 'Terminal', w: 600, h: 350, content: () => `<div style="padding:10px; color:#0f0; font-family:monospace; height:100%; overflow-y:auto;"><div id="log">NextOS Shell [v16.0]</div><div style="display:flex;">> <input id="ti" onkeydown="if(event.key==='Enter') {document.getElementById('log').innerHTML+='<br>> '+this.value; this.value='';}" style="background:none; border:none; color:#0f0; outline:none; flex:1; margin-left:5px;"></div></div>` },
        weather: { title: 'Weather', w: 300, h: 400, content: () => `<div style="height:100%; background:linear-gradient(#1d3ede, #01befe); padding:40px; text-align:center;"><i data-lucide="sun" style="width:50px; height:50px;"></i><h1>22°C</h1><p>Sunny</p></div>` },
        settings: { 
            title: 'Settings', w: 420, h: 420, 
            content: () => `
                <div style="padding:20px;">
                    <h3 style="margin-bottom:8px; font-size:15px;">Display Brightness</h3>
                    <input type="range" min="0.3" max="1" step="0.01" value="1" oninput="document.documentElement.style.setProperty('--brightness', this.value)" style="width:100%; accent-color:#007aff;">
                    
                    <hr style="border:0; border-top:1px solid #3a3a3c; margin:20px 0;">
                    
                    <h3 style="margin-bottom:8px; font-size:15px;">Wallpaper Themes</h3>
                    <div class="theme-grid">
                        ${themes.map(t => `<div class="theme-card" style="background-image:url('${t.url}');" onclick="setTheme('${t.url}')"><span>${t.name}</span></div>`).join('')}
                    </div>

                    <div style="margin-top:15px;">
                        <p style="font-size:12px; color:#aaa; margin-bottom:5px;">Custom Wallpaper URL:</p>
                        <div style="display:flex; gap:6px;">
                            <input id="custom-bg-input" placeholder="Paste image link..." style="flex:1; padding:6px 10px; border-radius:6px; border:none; background:#2a2a30; color:white; outline:none; font-size:12px;">
                            <button onclick="setTheme(document.getElementById('custom-bg-input').value)" style="padding:6px 12px; background:#007aff; border:none; border-radius:6px; color:white; cursor:pointer; font-size:12px;">Apply</button>
                        </div>
                    </div>
                </div>` 
        },
        help: { title: 'Help Guide', w: 400, h: 300, content: () => `<div style="padding:20px; color:#eee;"><h3>NextOS Guide</h3><p style="margin-top:10px; font-size:13px; line-height:1.5;">- Change desktop wallpapers and brightness inside Settings.<br>- Use traffic lights to close, minimize, or maximize apps.<br>- Use Gemini sparkle for quick AI assistance.</p></div>` }
    };

    function setTheme(url) {
        if (!url || !url.trim()) return;
        document.documentElement.style.setProperty('--bg', `url('${url.trim()}')`);
    }

    function sendGeminiMsg() {
        const input = document.getElementById('gemini-in');
        const chat = document.getElementById('gemini-chat');
        if(!input.value.trim()) return;
        chat.innerHTML += `<div style="margin-top:8px; text-align:right; color:#007aff;"><b>You:</b> ${input.value}</div>`;
        input.value = '';
        setTimeout(() => {
            chat.innerHTML += `<div style="margin-top:8px; color:#aaa;"><b>Gemini:</b> NextOS is looking great! Need any other settings or app updates?</div>`;
            chat.scrollTop = chat.scrollHeight;
        }, 500);
    }

    function unlock() { lock.classList.add('unlocked'); os.style.display = 'block'; }
    function lockOS() { lock.classList.remove('unlocked'); closeAllMenus(); }
    
    function toggleMenu(id) { 
        closeAllMenus();
        document.getElementById(id).classList.toggle('active'); 
    }
    
    function closeAllMenus() { 
        document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('active')); 
    }

    function minimizeAll() {
        Object.keys(wins).forEach(id => minA(id));
    }

    function closeAllApps() {
        Object.keys(wins).forEach(id => cA(id));
    }

    function toggleDarkMode() {
        alert('Theme updated!');
    }

    function loadSearch(url) {
        document.getElementById('browser-frame').src = url;
    }

    function openApp(id) {
        closeAllMenus();
        if (wins[id]) { wins[id].classList.remove('minimized'); wins[id].style.zIndex = ++zIndex; return; }
        const a = apps[id], w = document.createElement('div');
        w.className = 'win'; w.id = 'win-'+id; w.style.width = a.w+'px'; w.style.height = a.h+'px';
        w.style.left = '100px'; w.style.top = '100px'; w.style.zIndex = ++zIndex;
        w.innerHTML = `<div class="win-bar" onmousedown="sD(event,'${id}')"><div class="traffic-lights"><button class="tb tb-close" onclick="cA('${id}')"></button><button class="tb tb-min" onclick="minA('${id}')"></button><button class="tb tb-max" onclick="tF('${id}')"></button></div><span style="margin:auto; font-size:12px; font-weight:600;">${a.title}</span></div><div class="win-content">${a.content()}</div>`;
        os.appendChild(w); wins[id] = w;
        if(id === 'calendar') rC();
        lucide.createIcons();
    }

    function rC() {
        const root = document.getElementById('cal-root');
        const monthDays = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 0).getDate();
        const startDay = new Date(viewDate.getFullYear(), viewDate.getMonth(), 1).getDay();
        const isCurrentMonth = viewDate.getMonth() === today.getMonth() && viewDate.getFullYear() === today.getFullYear();
        
        // Days of week header row
        const weekdays = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
        let dayHeadersHtml = weekdays.map(day => `<div style="font-weight:bold; color:#8e8e93; font-size:12px; padding:6px 0;">${day}</div>`).join('');
        
        let gridHtml = '';
        for(let i=0; i<startDay; i++) gridHtml += `<div></div>`;
        for(let i=1; i<=monthDays; i++) {
            const blue = (isCurrentMonth && i === today.getDate()) ? 'background:#007aff; border-radius:50%; font-weight:bold;' : '';
            gridHtml += `<div style="padding:8px; ${blue}">${i}</div>`;
        }
        
        root.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center; padding:15px; background:#2c2c2e;">
                <button onclick="cD(-1)" style="background:none; border:none; color:white; cursor:pointer;"><i data-lucide="chevron-left"></i></button>
                <span style="font-weight:600;">${viewDate.toLocaleString('default',{month:'long'})} ${viewDate.getFullYear()}</span>
                <button onclick="cD(1)" style="background:none; border:none; color:white; cursor:pointer;"><i data-lucide="chevron-right"></i></button>
            </div>
            <div style="display:grid; grid-template-columns:repeat(7,1fr); padding:10px 10px 0 10px; text-align:center; border-bottom:0.5px solid #3a3a3c;">
                ${dayHeadersHtml}
            </div>
            <div style="display:grid; grid-template-columns:repeat(7,1fr); padding:10px; text-align:center; font-size:13px;">
                ${gridHtml}
            </div>`;
        lucide.createIcons();
    }

    window.cD = (d) => { viewDate.setMonth(viewDate.getMonth()+d); rC(); };
    window.hC = (b) => { const d = document.getElementById('d'); if(b==="C") calcVal=""; else if(b==="=") {try{calcVal=eval(calcVal).toString()}catch{calcVal="Error"}} else calcVal+=b; d.innerText = calcVal||"0"; };
    window.tF = (id) => wins[id].classList.toggle('fullscreen');
    window.minA = (id) => wins[id].classList.add('minimized');
    window.cA = (id) => { os.removeChild(wins[id]); delete wins[id]; };

    let dW = null, oX, oY;
    function sD(e, id) { if(wins[id].classList.contains('fullscreen')) return; dW = wins[id]; dW.style.zIndex = ++zIndex; oX = e.clientX - dW.offsetLeft; oY = e.clientY - dW.offsetTop; document.getElementById('active-app-name').innerText = apps[id].title; }
    document.onmousemove = (e) => { if(dW) { dW.style.left = (e.clientX-oX)+'px'; dW.style.top = (e.clientY-oY)+'px'; } };
    document.onmouseup = () => dW = null;

    setInterval(() => { 
        const now = new Date();
        const timeOptions = { hour: 'numeric', minute: '2-digit', hour12: true };
        const dateOptions = { weekday: 'short', month: 'short', day: 'numeric' };
        const tStr = now.toLocaleTimeString([], timeOptions);
        const dStr = now.toLocaleDateString([], dateOptions);
        
        document.getElementById('clock').innerText = tStr;
        document.getElementById('lock-time').innerText = tStr;
        document.getElementById('menubar-date').innerText = dStr;
    }, 1000);
    
    window.onload = () => lucide.createIcons();
</script>
</body>
</html>
